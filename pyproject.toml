[project]
name = "express"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.22",
    "ruff>=0.15.1",
    "taskipy>=1.14.1",
    "uvicorn>=0.41.0",
]

[tool.taskipy.tasks]
dev = "trap 'kill 0' EXIT; uv run task server & uv run task css_watch & wait"
server = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
css_watch = "cd assets && bunx --bun @tailwindcss/cli -i css/tailwind.css -o ../app/static/css/style.css --watch"
css_build = "cd assets && bunx --bun @tailwindcss/cli -i css/tailwind.css -o ../app/static/css/style.css --minify"
