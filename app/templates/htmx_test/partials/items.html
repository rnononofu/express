{% for item in items %}
<div id="item-{{ item.id }}" class="flex items-center justify-between p-2 rounded bg-base-200 mb-2">
    <span>{{ item.name }}</span>
    <button
        class="btn btn-error btn-xs"
        hx-delete="/htmx-test/items/{{ item.id }}"
        hx-target="#item-{{ item.id }}"
        hx-swap="outerHTML"
    >削除</button>
</div>
{% endfor %}
